name: Windows smoke tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolkit
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Toolkit.ps1 -IncludeWindowsUpdateScan
